<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crowd Analytics Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background: #f4f4f4; }
    canvas { background: #fff; border: 1px solid #ccc; padding: 1rem; }
    .filters { margin-bottom: 1rem; }
    select, button { margin-right: 1rem; padding: 0.4rem; }
  </style>
</head>
<body>
  <h1>Crowd Count Over Time</h1>

  <div class="filters">
    <label for="area">Area:</label>
    <select id="area">
      <option value="all">All</option>
      <option value="1">Area 1</option>
      <option value="2">Area 2</option>
      <option value="3">Area 3</option>
    </select>

    <label for="person">Person:</label>
    <select id="person">
      <option value="all">All</option>
      <option value="test-person">test-person</option>
      <option value="guest-123">guest-123</option>
      <option value="another-person">another-person</option>
    </select>

    <button id="filterBtn">Apply Filters</button>
  </div>

  <canvas id="myChart"></canvas>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let chartInstance = null;

      // ✅ Fetch data from backend
      async function fetchHistoryData() {
        try {
          const response = await fetch('https://crowd-backend-1.onrender.com/history');
          const data = await response.json();
          console.log("Fetched data:", data);
          return data;
        } catch (error) {
          console.error("Error fetching history:", error);
          return [];
        }
      }

      // ✅ Transform data for chart
      function transformData(data) {
        const grouped = {};
        data.forEach(entry => {
          const time = new Date(entry.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          grouped[time] = (grouped[time] || 0) + entry.count;
        });
        return {
          labels: Object.keys(grouped),
          values: Object.values(grouped)
        };
      }

      // ✅ Render chart
      function renderChart(labels, values) {
        const ctx = document.getElementById('myChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: 'Crowd Count Over Time',
              data: values,
              borderColor: 'blue',
              backgroundColor: 'lightblue',
              fill: false,
              tension: 0.3
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true,
                ticks: { stepSize: 5 }
              }
            }
          }
        });
      }

      // ✅ Apply filters
     async function applyFilters() {
  const area = document.getElementById('area').value;
  const person = document.getElementById('person').value;

  const rawData = await fetchHistoryData();
  console.log("Raw data:", rawData);
  console.log("Selected area:", area);
  console.log("Selected person:", person);

  const filtered = rawData.filter(entry => {
    const matchArea = area === "all" || String(entry.area_id) === area;
    const matchPerson = person === "all" || entry.person_id === person;
    return matchArea && matchPerson;
  });

  console.log("Filtered data:", filtered);

  if (filtered.length === 0) {
    alert("No data matches your filters.");
    renderChart([], []);
    return;
  }

  const { labels, values } = transformData(filtered);
  console.log("Labels:", labels);
  console.log("Values:", values);

  renderChart(labels, values);
}

      // ✅ Attach event + initial load
      document.getElementById('filterBtn').addEventListener('click', applyFilters);
      applyFilters();
    });
  </script>
</body>
</html>
