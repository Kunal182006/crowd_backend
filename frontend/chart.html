<!DOCTYPE html>
<html>
<head>
  <title>Crowd Count Over Time</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .status { display: flex; gap: 16px; align-items: center; margin: 8px 0 12px; color: #333; }
    .summary { font-weight: 600; }
    .no-data { color: #b00020; margin-top: 6px; display: none; }
    .shortcuts { display: flex; gap: 8px; margin-top: 6px; }
    canvas { max-width: 900px; }
    button { cursor: pointer; }
    select, input { padding: 4px 6px; }
  </style>
</head>
<body>
  <h2>Crowd Count Over Time</h2>

  <div class="controls">
    <label for="area">Area:</label>
    <select id="area">
      <option value="all">All Areas</option>
    </select>

    <label for="person">Person:</label>
    <select id="person">
      <option value="all">All Persons</option>
    </select>

    <label for="startTime">Start Time:</label>
    <input type="datetime-local" id="startTime">

    <label for="endTime">End Time:</label>
    <input type="datetime-local" id="endTime">

    <label for="groupBy">Group By:</label>
    <select id="groupBy">
      <option value="none">None</option>
      <option value="hour">Hour</option>
      <option value="day">Day</option>
    </select>

    <label for="autoRefresh">Auto-Refresh:</label>
    <input type="checkbox" id="autoRefresh" checked>

    <button id="applyBtn">Apply Filters</button>
  </div>

  <div class="shortcuts">
    <button onclick="setToday()">Today</button>
    <button onclick="setLastHour()">Last 1 Hour</button>
    <button onclick="setLast24Hours()">Last 24 Hours</button>
  </div>

  <div class="status">
    <div id="lastUpdated">Last updated: —</div>
    <div id="summary" class="summary">Total count: —</div>
  </div>

  <div id="noData" class="no-data">No data available for the selected filters.</div>

  <canvas id="crowdChart" width="900" height="380"></canvas>

  <script>
    let chart;
    let refreshInterval;
    const HISTORY_URL = 'https://crowd-backend-1.onrender.com/history';

    async function fetchHistoryData() {
      try {
        const response = await fetch(HISTORY_URL);
        const rawData = await response.json();
        return Array.isArray(rawData) ? rawData : [];
      } catch (error) {
        console.error("Error fetching history:", error);
        return [];
      }
    }

    async function populateDropdowns() {
      const rawData = await fetchHistoryData();
      const areas = [...new Set(rawData.map(e => e.area_id))].sort((a, b) => a - b);
      const persons = [...new Set(rawData.map(e => e.person_id))].sort();

      const areaSelect = document.getElementById("area");
      const personSelect = document.getElementById("person");

      areas.forEach(area => {
        const o = document.createElement("option");
        o.value = area;
        o.textContent = "Area " + area;
        areaSelect.appendChild(o);
      });

      persons.forEach(person => {
        const o = document.createElement("option");
        o.value = person;
        o.textContent = person;
        personSelect.appendChild(o);
      });
    }

    function groupKey(date, mode) {
      if (mode === "hour") {
        const d = new Date(date);
        return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours()).toISOString();
      }
      if (mode === "day") {
        const d = new Date(date);
        return new Date(d.getFullYear(), d.getMonth(), d.getDate()).toISOString();
      }
      return new Date(date).toISOString();
    }

    function formatLabel(iso, mode) {
      const d = new Date(iso);
      if (mode === "hour") return d.toLocaleString([], { month: 'short', day: '2-digit', hour: '2-digit' });
      if (mode === "day") return d.toLocaleDateString();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function aggregate(entries, mode) {
      const map = new Map();
      for (const e of entries) {
        const key = groupKey(e.created_at, mode);
        map.set(key, (map.get(key) || 0) + Number(e.count));
      }
      const grouped = Array.from(map.entries())
        .map(([iso, count]) => ({ iso, count }))
        .sort((a, b) => new Date(a.iso) - new Date(b.iso));

      const labels = grouped.map(g => formatLabel(g.iso, mode));
      const values = grouped.map(g => g.count);
      return { labels, values };
    }

    async function applyFilters() {
      const selectedArea = document.getElementById("area").value.trim();
      const selectedPerson = document.getElementById("person").value.trim();
      const startTime = document.getElementById("startTime").value;
      const endTime = document.getElementById("endTime").value;
      const groupBy = document.getElementById("groupBy").value;

      const rawData = await fetchHistoryData();

      const filtered = rawData.filter(entry => {
        const areaMatch = selectedArea === "all" || entry.area_id === Number(selectedArea);
        const personMatch = selectedPerson === "all" || entry.person_id === selectedPerson;
        const t = new Date(entry.created_at).getTime();
        const startMatch = !startTime || t >= new Date(startTime).getTime();
        const endMatch = !endTime || t <= new Date(endTime).getTime();
        return areaMatch && personMatch && startMatch && endMatch;
      });

      const noDataEl = document.getElementById("noData");
      const summaryEl = document.getElementById("summary");

      if (filtered.length === 0) {
        noDataEl.style.display = "block";
        summaryEl.textContent = "Total count: 0";
        renderChart([], []);
        updateLastUpdated();
        return;
      } else {
        noDataEl.style.display = "none";
      }

      const { labels, values } = aggregate(filtered, groupBy);
      const total = values.reduce((s, v) => s + v, 0);
      summaryEl.textContent = `Total count: ${total}`;
      renderChart(labels, values);
      updateLastUpdated();
    }

    function renderChart(labels, values) {
      const ctx = document.getElementById('crowdChart').getContext('2d');
      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Crowd Count Over Time',
            data: values,
            borderColor: '#1f6feb',
            backgroundColor: 'rgba(31, 111, 235, 0.12)',
            pointBackgroundColor: '#1f6feb',
            pointRadius: 3,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: true },
            tooltip: { enabled: true }
          },
          scales: {
            x: { title: { display: true, text: 'Time' } },
            y: { beginAtZero: true, title: { display: true, text: 'Count' } }
          }
        }
      });
    }

    function updateLastUpdated() {
      const el = document.getElementById("lastUpdated");
      el.textContent = `Last updated: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
    }

    function startAutoRefresh() {
      if (refreshInterval) clearInterval(refreshInterval);
      const checkbox = document.getElementById("autoRefresh");
      if (checkbox.checked) {
        refreshInterval = setInterval(applyFilters, 10000);
      }
    }

    // Date range shortcuts
    function setToday() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
      document.getElementById("startTime").value = start.toISOString().slice(0,16);
      document.getElementById("endTime").value = now.toISOString().slice(0,16);
      applyFilters();
    }

    function setLastHour() {
      const now = new Date();
      const oneHourAgo = new Date(now.getTime() - 60 * 60 * 1000);
      document.getElementById("startTime").value = oneHourAgo.toISOString().slice(0,16);
      document.getElementById("endTime").value = now.toISOString().slice(0,16);
      applyFilters();
    }

    function setLast24Hours() {
      const now = new Date();
      const oneDayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
      document.getElementById("startTime").value = oneDayAgo.toISOString().slice(0,16);
      document.getElementById("endTime").value = now.toISOString().slice(0,16);
      applyFilters();
    }

    // Event listeners and init
    document.getElementById("autoRefresh").addEventListener("change", startAutoRefresh);
    document.getElementById("applyBtn").addEventListener("click", applyFilters);
    document.getElementById("groupBy").addEventListener("change", applyFilters);

    (async function init() {
      await populateDropdowns();
      await applyFilters();
      startAutoRefresh();
    })();
  </script>
</body>
</html>
