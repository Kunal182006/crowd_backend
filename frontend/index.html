<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crowd Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #chart-container {
      width: 80%;
      margin: auto;
    }
  </style>
</head>
<body>
  <h1>Crowd Analytics Dashboard</h1>
  <div id="chart-container">
    <canvas id="myChart"></canvas>
  </div>

  <script>
    // ✅ Step 1: Fetch data from your backend
    async function fetchHistoryData() {
      try {
        const response = await fetch('https://crowd-backend-1.onrender.com/history');
        const data = await response.json();
        console.log("Fetched data:", data); // Debugging log
        return data;
      } catch (error) {
        console.error("Error fetching history:", error);
        return [];
      }
    }

    // ✅ Step 2: Transform data for Chart.js
    function transformData(data) {
      const grouped = {};

      data.forEach(entry => {
        // Convert timestamp into readable time (HH:MM)
        const time = new Date(entry.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        // Sum counts for each time slot
        grouped[time] = (grouped[time] || 0) + entry.count;
      });

      return {
        labels: Object.keys(grouped),   // X-axis labels (time)
        values: Object.values(grouped)  // Y-axis values (crowd counts)
      };
    }

    // ✅ Step 3: Render chart using Chart.js
    function renderChart(labels, values) {
      const ctx = document.getElementById('myChart').getContext('2d');
      new Chart(ctx, {
        type: 'line', // Line chart
        data: {
          labels: labels,
          datasets: [{
            label: 'Crowd Count Over Time',
            data: values,
            borderColor: 'blue',
            backgroundColor: 'lightblue',
            fill: false,
            tension: 0.2 // Smooth curve
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: true }
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    }

    // ✅ Step 4: Combine everything
    fetchHistoryData().then(data => {
      const { labels, values } = transformData(data);
      renderChart(labels, values);
    });
  </script>
</body>
</html>
